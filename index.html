<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <script>
    window.__ERRORS__ = [];
    window.addEventListener('error', function(e) {
      console.error('[SmartAttend System Error]', e);
      window.__ERRORS__.push(e.message + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno);
      var root = document.getElementById('app-root');
      if (root && (!root.children || root.children.length === 0)) {
        root.innerHTML = '<div style="max-width:600px;margin:40px auto;padding:24px;background:#fff1f2;border:2px solid #f43f5e;border-radius:16px;font-family:sans-serif;color:#881337;"><h3 style="margin-top:0;font-size:18px;font-weight:bold;">Đã xảy ra sự cố khởi chạy SmartAttend</h3><p style="font-size:13px;color:#4c0519;margin-bottom:16px;">' + (e.message || 'Vui lòng khôi phục bộ nhớ tạm trình duyệt.') + '</p><button onclick="localStorage.clear();location.reload();" style="padding:10px 18px;background:#e11d48;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:12px;">Khôi phục Dữ liệu Chuẩn &amp; Tải lại</button></div>';
      }
    });
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI SMARTATTEND ĐỒNG NAI | Điểm danh và cấp chứng nhận điện tử bằng AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Thư viện tạo và tải PDF chứng nhận điện tử chuẩn quốc tế -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- jsQR phục vụ quét QR thực tế từ camera điện thoại/laptop -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900">
  <!-- System Status Banner (Vận hành Thực tế) -->
  <div id="system-banner" class="bg-brand-900 text-white text-xs py-1.5 px-4 flex flex-wrap items-center justify-between gap-2 no-print border-b border-brand-800">
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold border border-emerald-400/30">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> HỆ THỐNG VẬN HÀNH THỰC
      </span>
      <span class="text-brand-100 hidden sm:inline">AI SmartAttend Đồng Nai • Liên thông 11 trường Đại học & Cao đẳng</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="window.app.openPublicVerify()" class="px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-200 hover:bg-emerald-500/30 border border-emerald-400/30 transition font-medium flex items-center gap-1">
        <i data-lucide="shield-check" class="w-3 h-3"></i> Tra cứu QR Chứng nhận
      </button>
      <button onclick="window.app.openConnectionModal()" class="px-2.5 py-0.5 rounded bg-white/10 hover:bg-white/20 transition font-medium text-brand-100 flex items-center gap-1">
        <i data-lucide="database" class="w-3 h-3"></i> Supabase & Backend
      </button>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app-root" class="min-h-screen flex flex-col"></div>

  <!-- Global Modal Container -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toast-root" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0 no-print"></div>

  <!-- Scripts nạp theo thứ tự mô-đun -->
  <script>window.SA = { Views: {} };</script>
  <script src="js/config.js"></script>
  <script src="js/administrative.js"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/ui.js"></script>
  <script src="js/components/face-verification.js"></script>
  <script src="js/components/chatbot.js"></script>
  <script src="js/views/student.js"></script>
  <script src="js/views/organizer.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/verify.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
